<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>صمّم غرفتك</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Tajawal', sans-serif;
    }
    
    body {
      background: linear-gradient(135deg, #fce4ec 0%, #e3f2fd 100%);
      min-height: 100vh;
      padding: 20px;
    }
    
    .container {
      max-width: 900px;
      margin: 0 auto;
    }
    
    header {
      text-align: center;
      padding: 30px;
      background: white;
      border-radius: 20px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.1);
      margin-bottom: 20px;
    }
    
    header h1 {
      color: #d81b60;
      font-size: 2.5em;
      margin-bottom: 10px;
    }
    
    header p {
      color: #666;
      font-size: 1.1em;
    }
    
    .card {
      background: white;
      padding: 25px;
      border-radius: 20px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.1);
      margin-bottom: 20px;
    }
    
    .card h2 {
      color: #d81b60;
      margin-bottom: 20px;
      font-size: 1.5em;
    }
    
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      margin-bottom: 15px;
    }
    
    @media (max-width: 600px) {
      .form-row {
        grid-template-columns: 1fr;
      }
    }
    
    .form-group {
      margin-bottom: 15px;
    }
    
    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
      color: #555;
    }
    
    input[type="number"],
    select {
      width: 100%;
      padding: 12px;
      border: 2px solid #eee;
      border-radius: 10px;
      font-size: 1em;
      font-family: 'Tajawal', sans-serif;
      transition: 0.3s;
    }
    
    input[type="number"]:focus,
    select:focus {
      outline: none;
      border-color: #d81b60;
    }
    
    .checkbox-group {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      margin-top: 10px;
    }
    
    .checkbox-group label {
      display: flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      font-weight: normal;
    }
    
    .checkbox-group input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
    }
    
    .btn {
      background: linear-gradient(135deg, #d81b60, #ad1457);
      color: white;
      border: none;
      padding: 14px 40px;
      border-radius: 12px;
      font-size: 1.1em;
      cursor: pointer;
      font-weight: bold;
      font-family: 'Tajawal', sans-serif;
      transition: 0.3s;
    }
    
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(216, 27, 96, 0.4);
    }
    
    .btn-secondary {
      background: #eee;
      color: #333;
    }
    
    .btn-container {
      text-align: center;
      margin-top: 25px;
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }
    
    .styles-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 15px;
      margin-bottom: 20px;
    }
    
    .style-card {
      background: #fafafa;
      border: 3px solid transparent;
      border-radius: 15px;
      padding: 20px 10px;
      text-align: center;
      cursor: pointer;
      transition: 0.3s;
    }
    
    .style-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }
    
    .style-card.active {
      border-color: #d81b60;
      background: #fce4ec;
    }
    
    .style-card .emoji {
      font-size: 2.5em;
      display: block;
      margin-bottom: 8px;
    }
    
    .style-card .name {
      font-weight: bold;
      color: #333;
    }
    
    .step {
      display: none;
      animation: fadeIn 0.4s ease;
    }
    
    .step.active {
      display: block;
    }
    
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    /* --- تصميم الغرفة --- */
    .room-container {
      background: #f5f5f5;
      border-radius: 15px;
      padding: 20px;
      margin-bottom: 20px;
    }
    
    .room-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      flex-wrap: wrap;
      gap: 10px;
    }
    
    .room-info span {
      background: white;
      padding: 8px 15px;
      border-radius: 10px;
      font-weight: bold;
      color: #d81b60;
    }
    
    .room {
      position: relative;
      width: 100%;
      height: 400px;
      background: white;
      border: 3px solid #333;
      border-radius: 10px;
      overflow: hidden;
      background-image: 
        linear-gradient(rgba(0,0,0,0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,0,0,0.05) 1px, transparent 1px);
      background-size: 30px 30px;
    }
    
    .room-item {
      position: absolute;
      background: white;
      padding: 8px 12px;
      border-radius: 10px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.15);
      cursor: pointer;
      transition: 0.3s;
      font-size: 0.9em;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    
    .room-item:hover {
      transform: scale(1.1);
      z-index: 10;
      box-shadow: 0 5px 15px rgba(216, 27, 96, 0.3);
    }
    
    .room-item .emoji {
      font-size: 1.3em;
    }
    
    .door-marker, .window-marker {
      position: absolute;
      background: #333;
      color: white;
      padding: 4px 8px;
      border-radius: 5px;
      font-size: 0.8em;
      font-weight: bold;
    }
    
    .window-marker {
      background: #2196f3;
    }
    
    /* --- جدول الميزانية --- */
    .budget-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }
    
    .budget-table th,
    .budget-table td {
      padding: 12px;
      text-align: right;
      border-bottom: 1px solid #eee;
    }
    
    .budget-table th {
      background: #fce4ec;
      color: #d81b60;
      font-weight: bold;
    }
    
    .budget-table tr:hover {
      background: #fafafa;
    }
    
    .budget-total {
      background: #e8f5e9 !important;
      font-weight: bold;
    }
    
    .budget-remaining {
      background: #fff3e0 !important;
      font-weight: bold;
    }
    
    .budget-negative {
      background: #ffebee !important;
      color: #c62828;
    }
    
    .buy-btn {
      background: #d81b60;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85em;
      font-family: 'Tajawal', sans-serif;
    }
    
    .buy-btn:hover {
      background: #ad1457;
    }
    
    .hint {
      text-align: center;
      color: #888;
      font-size: 0.9em;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    
    <header>
      <h1>🛏️ صمّم غرفتك</h1>
      <p>خلّني أصمم غرفتك على قد ميزانيتك </p>
    </header>
    
    <!-- ========== الخطوة 1: بيانات الغرفة ========== -->
    <div class="step active" id="step1">
      <div class="card">
        <h2>📐 الخطوة 1: بيانات غرفتك</h2>
        
        <div class="form-row">
          <div class="form-group">
            <label>📏 طول الغرفة (متر)</label>
            <input type="number" id="roomLength" value="4" min="2" max="10">
          </div>
          <div class="form-group">
            <label>📐 عرض الغرفة (متر)</label>
            <input type="number" id="roomWidth" value="3" min="2" max="10">
          </div>
        </div>
        
        <div class="form-row">
          <div class="form-group">
            <label>🚪 موقع الباب</label>
            <select id="doorLocation">
              <option value="right">الجدار اليمين</option>
              <option value="left">الجدار اليسار</option>
              <option value="front">الجدار الأمامي</option>
              <option value="back">الجدار الخلفي</option>
            </select>
          </div>
          <div class="form-group">
            <label>🪟 موقع الشباك</label>
            <select id="windowLocation">
              <option value="front">الجدار الأمامي</option>
              <option value="back">الجدار الخلفي</option>
              <option value="right">الجدار اليمين</option>
              <option value="left">الجدار اليسار</option>
            </select>
          </div>
        </div>
        
        <div class="form-group">
          <label>🛋️ الأثاث الموجود عندك</label>
          <div class="checkbox-group">
            <label><input type="checkbox" value="سرير" checked> ️ سرير</label>
            <label><input type="checkbox" value="مكتب" checked> 🖥️ مكتب</label>
            <label><input type="checkbox" value="دولاب" checked> 🚪 دولاب</label>
            <label><input type="checkbox" value="كرسي"> 🪑 كرسي</label>
            <label><input type="checkbox" value="رفوف"> 📚 رفوف</label>
          </div>
        </div>
        
        <div class="form-group">
          <label>💰 ميزانيتك (ريال)</label>
          <input type="number" id="budget" value="1500" min="100" step="50">
        </div>
        
        <div class="btn-container">
          <button class="btn" onclick="goToStep(2)">التالي: اختر الستايل ←</button>
        </div>
      </div>
    </div>
    
    <!-- ========== الخطوة 2: اختيار الستايل ========== -->
    <div class="step" id="step2">
      <div class="card">
        <h2>🎨 الخطوة 2: اختر ستايل غرفتك</h2>
        <p style="color:#666; margin-bottom:20px;">اضغطي على الستايل اللي يعجبك:</p>
        
        <div class="styles-grid">
          <div class="style-card" onclick="selectStyle(this, 'هادئ وبسيط')">
            <span class="emoji">🌿</span>
            <span class="name">هادئ وبسيط</span>
          </div>
          <div class="style-card" onclick="selectStyle(this, 'كيوت')">
            <span class="emoji">🌸</span>
            <span class="name">كيوت</span>
          </div>
          <div class="style-card" onclick="selectStyle(this, 'مودرن')">
            <span class="emoji">✨</span>
            <span class="name">مودرن</span>
          </div>
          <div class="style-card" onclick="selectStyle(this, 'Gaming')">
            <span class="emoji"></span>
            <span class="name">Gaming</span>
          </div>
          <div class="style-card" onclick="selectStyle(this, 'فخم')">
            <span class="emoji">👑</span>
            <span class="name">فخم</span>
          </div>
        </div>
        
        <div class="btn-container">
          <button class="btn btn-secondary" onclick="goToStep(1)">→ رجوع</button>
          <button class="btn" onclick="generateDesign()">✨ صمّم غرفتي</button>
        </div>
      </div>
    </div>
    
    <!-- ========== الخطوة 3: التصميم والميزانية ========== -->
    <div class="step" id="step3">
      
      <!-- عرض الغرفة -->
      <div class="card">
        <h2> تصميم غرفتك — <span id="chosenStyle"></span></h2>
        <div class="room-container">
          <div class="room-info">
            <span id="roomSize"></span>
            <span id="budgetInfo"></span>
          </div>
          <div class="room" id="room"></div>
          <p class="hint">💡 اضغطي على أي قطعة لمعرفة تفاصيلها</p>
        </div>
      </div>
      
      <!-- جدول الميزانية -->
      <div class="card">
        <h2>💰 تفاصيل الميزانية</h2>
        <table class="budget-table">
          <thead>
            <tr>
              <th>القطعة</th>
              <th>السعر</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="budgetBody"></tbody>
        </table>
      </div>
      
      <div class="btn-container">
        <button class="btn btn-secondary" onclick="goToStep(1)">🔄 ابدأ من جديد</button>
      </div>
    </div>
    
  </div>
  
  <script>
    let selectedStyleName = '';
    let roomData = {};
    
    // بيانات القطع لكل ستايل
    const itemsDB = {
      'هادئ وبسيط': [
        {name:'سجادة بيج', price:120, emoji:'🟫', x:15, y:55},
        {name:'إضاءة دافئة', price:70, emoji:'💡', x:70, y:10},
        {name:'مرآة خشبية', price:150, emoji:'🪞', x:75, y:45},
        {name:'طاولة صغيرة', price:300, emoji:'🪵', x:45, y:70},
        {name:'ستارة كتان', price:100, emoji:'🪟', x:85, y:25},
        {name:'نباتات ديكور', price:160, emoji:'🌿', x:8, y:15}
      ],
      'كيوت': [
        {name:'سجادة وردية', price:130, emoji:'', x:15, y:55},
        {name:'إضاءة نجمة', price:80, emoji:'⭐', x:70, y:10},
        {name:'مرآة قلب', price:160, emoji:'💖', x:75, y:45},
        {name:'مكتب كيوت', price:320, emoji:'🎀', x:45, y:70},
        {name:'ستارة شيفون', price:110, emoji:'🩷', x:85, y:25},
        {name:'دمى ديكور', price:170, emoji:'🧸', x:8, y:15}
      ],
      'مودرن': [
        {name:'سجادة رمادية', price:140, emoji:'⬜', x:15, y:55},
        {name:'إضاءة LED', price:90, emoji:'💡', x:70, y:10},
        {name:'مرآة دائرية', price:180, emoji:'', x:75, y:45},
        {name:'طاولة زجاج', price:350, emoji:'🔷', x:45, y:70},
        {name:'ستارة رول', price:120, emoji:'🪟', x:85, y:25},
        {name:'لوحة تجريدية', price:190, emoji:'🖼️', x:8, y:15}
      ],
      'Gaming': [
        {name:'سجادة RGB', price:150, emoji:'🎮', x:15, y:55},
        {name:'إضاءة نيون', price:100, emoji:'💜', x:70, y:10},
        {name:'مرآة LED', price:170, emoji:'🪞', x:75, y:45},
        {name:'مكتب قيمنق', price:400, emoji:'🖥️', x:45, y:70},
        {name:'ستارة سوداء', price:130, emoji:'⬛', x:85, y:25},
        {name:'بوسترات ألعاب', price:180, emoji:'🕹️', x:8, y:15}
      ],
      'فخم': [
        {name:'سجادة حرير', price:200, emoji:'👑', x:15, y:55},
        {name:'ثريا كريستال', price:150, emoji:'💎', x:70, y:10},
        {name:'مرآة ذهبية', price:250, emoji:'✨', x:75, y:45},
        {name:'طاولة رخام', price:500, emoji:'️', x:45, y:70},
        {name:'ستارة مخمل', price:180, emoji:'🟤', x:85, y:25},
        {name:'تمثال ديكور', price:280, emoji:'🗿', x:8, y:15}
      ]
    };
    
    function goToStep(stepNumber) {
      document.querySelectorAll('.step').forEach(step => {
        step.classList.remove('active');
      });
      document.getElementById('step' + stepNumber).classList.add('active');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
    
    function selectStyle(element, styleName) {
      document.querySelectorAll('.style-card').forEach(card => {
        card.classList.remove('active');
      });
      element.classList.add('active');
      selectedStyleName = styleName;
    }
    
    function generateDesign() {
      if (!selectedStyleName) {
        alert('⚠️ اختاري ستايل أولاً!');
        return;
      }
      
      // حفظ بيانات الغرفة
      roomData = {
        length: document.getElementById('roomLength').value,
        width: document.getElementById('roomWidth').value,
        budget: parseInt(document.getElementById('budget').value),
        door: document.getElementById('doorLocation').value,
        window: document.getElementById('windowLocation').value
      };
      
      // عرض معلومات الغرفة
      document.getElementById('chosenStyle').textContent = selectedStyleName;
      document.getElementById('roomSize').textContent = ` ${roomData.length}م × ${roomData.width}م`;
      document.getElementById('budgetInfo').textContent = `💰 الميزانية: ${roomData.budget} ريال`;
      
      // رسم الغرفة
      drawRoom();
      
      // بناء جدول الميزانية
      buildBudgetTable();
      
      goToStep(3);
    }
    
    function drawRoom() {
      const room = document.getElementById('room');
      room.innerHTML = '';
      
      // إضافة علامة الباب
      const door = document.createElement('div');
      door.className = 'door-marker';
      door.textContent = '🚪 باب';
      const doorPos = getWallPosition(roomData.door);
      door.style.left = doorPos.x + '%';
      door.style.top = doorPos.y + '%';
      room.appendChild(door);
      
      // إضافة علامة الشباك
      const win = document.createElement('div');
      win.className = 'window-marker';
      win.textContent = '🪟 شباك';
      const winPos = getWallPosition(roomData.window);
      win.style.left = winPos.x + '%';
      win.style.top = winPos.y + '%';
      room.appendChild(win);
      
      // إضافة قطع الأثاث
      const items = itemsDB[selectedStyleName];
      items.forEach(item => {
        const div = document.createElement('div');
        div.className = 'room-item';
        div.style.left = item.x + '%';
        div.style.top = item.y + '%';
        div.innerHTML = `<span class="emoji">${item.emoji}</span><span>${item.name}</span>`;
        div.onclick = () => alert(`🛍️ ${item.name}\nالسعر: ${item.price} ريال\n\n(لاحقاً سنربطها بالمتاجر!)`);
        room.appendChild(div);
      });
    }
    
    function getWallPosition(wall) {
      const positions = {
        'right': { x: 85, y: 45 },
        'left': { x: 2, y: 45 },
        'front': { x: 45, y: 2 },
        'back': { x: 45, y: 90 }
      };
      return positions[wall] || positions['right'];
    }
    
    function buildBudgetTable() {
      const tbody = document.getElementById('budgetBody');
      tbody.innerHTML = '';
      
      const items = itemsDB[selectedStyleName];
      let total = 0;
      
      items.forEach(item => {
        total += item.price;
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${item.emoji} ${item.name}</td>
          <td>${item.price} ريال</td>
          <td><button class="buy-btn" onclick="alert('قريباً: خيارات الشراء من متاجر مختلفة!')">شراء</button></td>
        `;
        tbody.appendChild(tr);
      });
      
      // صف المجموع
      const totalRow = document.createElement('tr');
      totalRow.className = 'budget-total';
      totalRow.innerHTML = `<td>المجموع</td><td>${total} ريال</td><td></td>`;
      tbody.appendChild(totalRow);
      
      // صف المتبقي
      const remaining = roomData.budget - total;
      const remainingRow = document.createElement('tr');
      remainingRow.className = remaining >= 0 ? 'budget-remaining' : 'budget-negative';
      const status = remaining >= 0 ? '✅' : '⚠️ تجاوزتِ الميزانية!';
      remainingRow.innerHTML = `<td>المتبقي من ميزانيتك</td><td>${remaining} ريال ${status}</td><td></td>`;
      tbody.appendChild(remainingRow);
    }
  </script>
  
</body>
</html>
