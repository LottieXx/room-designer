<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>صمّم غرفتك</title>
  
  <!-- خط عربي جميل من جوجل -->
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Tajawal', sans-serif;
    }
    
    body {
      background: linear-gradient(135deg, #fce4ec 0%, #e3f2fd 100%);
      min-height: 100vh;
      padding: 20px;
    }
    
    .container {
      max-width: 900px;
      margin: 0 auto;
    }
    
    header {
      text-align: center;
      padding: 30px;
      background: white;
      border-radius: 20px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.1);
      margin-bottom: 20px;
    }
    
    header h1 {
      color: #d81b60;
      font-size: 2.5em;
      margin-bottom: 10px;
    }
    
    header p {
      color: #666;
      font-size: 1.1em;
    }
    
    .card {
      background: white;
      padding: 25px;
      border-radius: 20px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.1);
      margin-bottom: 20px;
    }
    
    .card h2 {
      color: #d81b60;
      margin-bottom: 15px;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🛏️ صمّم غرفتك</h1>
      <p>خلّني أصمم غرفتك على قد ميزانيتك ✨</p>
    </header>
    
    <div class="card">
      <h2>مرحباً بك! 👋</h2>
      <p>هنا نبدأ ببناء الموقع خطوة بخطوة...</p>
    </div>
  </div>
</body>
</html>
